# SonarQube for the SAST platform (local / QC use).
#
# Brings up a single SonarQube Community container on :9000 with
# persistent volumes so projects, tokens, and analysis survive
# restarts. The platform's Django app and qcluster still run natively
# on the host; only SonarQube is containerized here.
#
#   docker compose up -d sonarqube
#   # wait until http://localhost:9000 is UP (first boot ~1-2 min)
#
# First-boot login is admin / admin (you'll be forced to change it).
# Then generate a token (Account > Security) and put it in .env as
# SONAR_TOKEN, or paste it into the in-app admin console (Sonar tab).
#
# NOTE: SonarQube's embedded Elasticsearch needs vm.max_map_count >=
# 262144. Docker Desktop's WSL2 VM sets this by default; if Sonar's
# log shows a max_map_count bootstrap error, raise it on the host.
#
# The single-container setup uses SonarQube's embedded H2 database
# (fine for evaluation/QC). For a longer-lived instance, uncomment the
# `db` service and the SONAR_JDBC_* env below to back it with Postgres.

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sast-sonarqube
    ports:
      - "9000:9000"
    environment:
      # Skip the bytecode/embedded-DB bootstrap checks that otherwise
      # stop the container on a dev box.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      # --- Postgres backend (optional; uncomment with the db service) ---
      # SONAR_JDBC_URL: "jdbc:postgresql://db:5432/sonar"
      # SONAR_JDBC_USERNAME: "sonar"
      # SONAR_JDBC_PASSWORD: "sonar"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    # depends_on:
    #   - db

  # Optional Postgres backend for SonarQube. Uncomment this service and
  # the SONAR_JDBC_* env above to use it instead of embedded H2.
  # db:
  #   image: postgres:16
  #   container_name: sast-sonarqube-db
  #   environment:
  #     POSTGRES_USER: sonar
  #     POSTGRES_PASSWORD: sonar
  #     POSTGRES_DB: sonar
  #   volumes:
  #     - sonarqube_db:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  # sonarqube_db:
